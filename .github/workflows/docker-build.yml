name: Docker build

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
    branches: [main]

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # ffmpeg is needed by the recording tests (segment buffer + clip stitching).
      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - name: Install backend dependencies
        working-directory: backend
        run: pip install -q -r requirements-dev.txt

      - name: Run backend tests
        working-directory: backend
        shell: bash
        run: |
          set -o pipefail
          python -m pytest -q -rA tests 2>&1 | tee pytest.out || status=$?
          # Surface failures as annotations so they're readable from the
          # check-run API without downloading logs. `|| true`: the step runs
          # under bash -e, and grep exits 1 when there's nothing to report -
          # which, without it, failed the job precisely when every test passed.
          { grep -E "^(FAILED|ERROR) " pytest.out || true; } | while read -r line; do
            echo "::error title=pytest::${line:0:900}"
          done
          tail -n 1 pytest.out | sed 's/^/::notice title=pytest summary::/'
          exit ${status:-0}

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate compose file
        run: docker compose config -q

      - name: Build backend + frontend images
        run: docker compose build backend frontend

      - name: Build the AI worker (cpu) and smoke-test it
        run: |
          docker build -f ai-worker/Dockerfile -t lightnvr-ai-worker:ci .
          docker run -d --name aiw -p 18811:8811 lightnvr-ai-worker:ci
          for i in $(seq 1 30); do curl -fs http://localhost:18811/health && break; sleep 2; done
          curl -fs http://localhost:18811/v2/capabilities
          docker rm -f aiw

      - name: Boot the stack and smoke-test the API
        run: |
          docker compose up -d backend frontend nginx
          # nginx only starts once the backend's own healthcheck passes
          # (start_period 15s + up to 30s between retries) - generous budget
          # here so a slow CI runner doesn't produce a false failure.
          for i in $(seq 1 40); do
            curl -fsk https://localhost:8443/api/health && break
            sleep 3
          done
          curl -fsk https://localhost:8443/api/health

      - name: Dump logs on failure
        if: failure()
        run: docker compose logs

      - name: Tear down
        if: always()
        run: docker compose down -v
