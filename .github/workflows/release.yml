name: Release

# Cuts a release when a version tag is pushed: builds backend and frontend
# images for amd64 and arm64, pushes them to GHCR as multi-arch manifests, and
# creates a GitHub Release. Publishing the code stays on the `main` branch's
# own CI (docker-build.yml); this workflow is only about shipping tagged
# artifacts.
#
#   git tag v0.2.0 && git push origin v0.2.0
#
# Each architecture is built on its OWN native runner (amd64 on ubuntu-latest,
# arm64 on ubuntu-24.04-arm) rather than cross-building arm64 under QEMU
# emulation. Emulated arm64 Node/Vite builds (rollup/esbuild) can hang for
# hours; native runners finish in minutes. The two per-arch images are pushed
# by digest and then stitched into one multi-arch tag by the merge job.
#
# One-time after the first run: make the two packages public under
# https://github.com/users/manojmkss/packages so `docker compose pull` works
# without authentication (Package settings -> Change visibility -> Public).

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write   # create the GitHub Release
  packages: write   # push images to GHCR

env:
  # GHCR requires lowercase names; the repo is "Light_NVR" so this is spelled
  # out lowercase rather than derived from ${{ github.repository }}.
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/light_nvr

jobs:
  build:
    # One leg per (image, architecture), each on a runner whose CPU natively
    # matches the target - no emulation anywhere.
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        # flavor: tag suffix ("" for backend/frontend; the ai-worker ships one
        # image per accelerator: -cpu (both arches), -openvino and -cuda (amd64)).
        include:
          - { name: backend,   flavor: "",          context: ./backend,  file: "",                   args: "",                platform: linux/amd64, arch: amd64, runner: ubuntu-latest }
          - { name: backend,   flavor: "",          context: ./backend,  file: "",                   args: "",                platform: linux/arm64, arch: arm64, runner: ubuntu-24.04-arm }
          - { name: frontend,  flavor: "",          context: ./frontend, file: "",                   args: "",                platform: linux/amd64, arch: amd64, runner: ubuntu-latest }
          - { name: frontend,  flavor: "",          context: ./frontend, file: "",                   args: "",                platform: linux/arm64, arch: arm64, runner: ubuntu-24.04-arm }
          - { name: ai-worker, flavor: "-cpu",      context: .,          file: ai-worker/Dockerfile, args: "VARIANT=cpu",     platform: linux/amd64, arch: amd64, runner: ubuntu-latest }
          - { name: ai-worker, flavor: "-cpu",      context: .,          file: ai-worker/Dockerfile, args: "VARIANT=cpu",     platform: linux/arm64, arch: arm64, runner: ubuntu-24.04-arm }
          - { name: ai-worker, flavor: "-openvino", context: .,          file: ai-worker/Dockerfile, args: "VARIANT=openvino", platform: linux/amd64, arch: amd64, runner: ubuntu-latest }
          - { name: ai-worker, flavor: "-cuda",     context: .,          file: ai-worker/Dockerfile, args: "VARIANT=cuda\nBASE_IMAGE=nvidia/cuda:12.4.1-cudnn-runtime-ubuntu22.04", platform: linux/amd64, arch: amd64, runner: ubuntu-latest }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # push-by-digest publishes the image blob without a tag; the merge job
      # below assembles the tags. name-canonical keeps the pushed reference
      # under the final repo name so imagetools can find it by digest.
      - name: Free disk space for the CUDA image
        if: matrix.flavor == '-cuda'
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL

      - name: Build and push ${{ matrix.name }}${{ matrix.flavor }} (${{ matrix.arch }}) by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file != '' && matrix.file || format('{0}/Dockerfile', matrix.context) }}
          build-args: ${{ matrix.args }}
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ env.IMAGE_PREFIX }}-${{ matrix.name }},push-by-digest=true,name-canonical=true,push=true
          # Cache is per image, flavor AND arch so the legs don't clobber each
          # other's layers.
          cache-from: type=gha,scope=${{ matrix.name }}${{ matrix.flavor }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}${{ matrix.flavor }}-${{ matrix.arch }}

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.name }}${{ matrix.flavor }}-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    # One manifest per image, stitching that image's per-arch digests into a
    # single multi-arch tag (:<version> and :latest).
    needs: build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { name: backend,   flavor: "" }
          - { name: frontend,  flavor: "" }
          - { name: ai-worker, flavor: "-cpu" }
          - { name: ai-worker, flavor: "-openvino" }
          - { name: ai-worker, flavor: "-cuda" }
    steps:
      - name: Download this image's digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-${{ matrix.name }}${{ matrix.flavor }}-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive version (strip the leading v)
        id: ver
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Create and push the multi-arch manifest
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            -t "${IMAGE_PREFIX}-${{ matrix.name }}:${{ steps.ver.outputs.version }}${{ matrix.flavor }}" \
            -t "${IMAGE_PREFIX}-${{ matrix.name }}:latest${{ matrix.flavor }}" \
            $(printf "${IMAGE_PREFIX}-${{ matrix.name }}@sha256:%s " *)

      - name: Inspect the pushed manifest
        run: docker buildx imagetools inspect "${IMAGE_PREFIX}-${{ matrix.name }}:${{ steps.ver.outputs.version }}${{ matrix.flavor }}"

  release:
    needs: merge
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          body: |
            Prebuilt images for this release (tags without the leading "v"):

            - `ghcr.io/${{ github.repository_owner }}/light_nvr-backend` and `light_nvr-frontend` (amd64 + arm64)
            - `ghcr.io/${{ github.repository_owner }}/light_nvr-ai-worker` `-cpu` (amd64 + arm64), `-openvino` and `-cuda` (amd64)

            Upgrade an existing install:

            ```bash
            ./scripts/update-linux.sh
            ```

            Set up (or re-check) the local AI service: `./scripts/enable-ai.sh`

            No build step needed - the images above are pulled directly. See
            [CHANGELOG.md](CHANGELOG.md) for what changed.
