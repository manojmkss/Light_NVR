# LightNVR Vision on ANOTHER machine (typically a PC with a GPU).
# (On the NVR box itself, use ./scripts/enable-ai.sh in the main folder instead.)
#
#   cd ai-worker
#   cp .env.example .env          # set AI_WORKER_API_KEY, pick AI_WORKER_VARIANT
#   docker compose up -d
#   ../scripts/fetch-ai-models.sh yolov8s --volume lightnvr-ai-worker-models
#
# Then in LightNVR: Settings -> AI -> "Another PC running the LightNVR ai-worker",
# address http://<this-machine-ip>:8811, the same key, "Check it works".
#
# NVIDIA: set AI_WORKER_VARIANT=cuda and also start with the GPU override:
#   docker compose -f docker-compose.yml -f docker-compose.nvidia.yml up -d
# (needs the NVIDIA Container Toolkit). Intel GPU: AI_WORKER_VARIANT=openvino
# plus -f docker-compose.intel.yml.

services:
  ai-worker:
    image: ghcr.io/manojmkss/light_nvr-ai-worker:${LIGHTNVR_VERSION:-latest}-${AI_WORKER_VARIANT:-cpu}
    build:
      context: ..
      dockerfile: ai-worker/Dockerfile
      args:
        VARIANT: ${AI_WORKER_VARIANT:-cpu}
        BASE_IMAGE: ${AI_WORKER_BASE_IMAGE:-python:3.11-slim}
    container_name: lightnvr-ai-worker
    restart: unless-stopped
    init: true
    environment:
      # Blank = no auth. Fine on a trusted LAN; set it otherwise, since this
      # endpoint decodes any image posted to it.
      AI_WORKER_API_KEY: ${AI_WORKER_API_KEY:-}
      AI_WORKER_MODEL: ${AI_WORKER_MODEL:-yolov8n}
      AI_WORKER_PROVIDER: ${AI_WORKER_PROVIDER:-auto}
    ports:
      - "${AI_WORKER_PORT:-8811}:8811"
    volumes:
      - ai-worker-models:/data

volumes:
  ai-worker-models:
    name: lightnvr-ai-worker-models
